# Rate limiting zone: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=deploy_limit:10m rate=10r/s;

# Upstream timeouts and limits
client_max_body_size 1m;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 15s;

# HTTP -> Redirect to HTTPS (Port 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow Let's Encrypt ACME challenge on plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # =========================================================================
    # SSL Certificate Configuration:
    # MODE A: Production with Domain (Certbot Let's Encrypt)
    #   ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #
    # MODE B: Self-Signed Demo Certificate (Generated by infra/ec2-setup.sh)
    # =========================================================================
    ssl_certificate /etc/ssl/certs/secure-deploy-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/secure-deploy-selfsigned.key;

    # TLS Protocols & Ciphers (Hardened TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security: only on HTTPS block)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Include security snippet
    include /etc/nginx/snippets/security.conf;

    # Global rate limiting
    limit_req zone=deploy_limit burst=20 nodelay;

    # Root landing / healthcheck
    location = / {
        default_type application/json;
        return 200 '{"status":"ok","system":"secure-deploy-edge","time":"$time_iso8601"}';
    }

    # Dynamic reverse proxies loaded from conf.d
    include /etc/nginx/conf.d/*.conf;
}
