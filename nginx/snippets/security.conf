# Hardened Nginx Security Snippet for secure-deploy

# Hide Nginx version
server_tokens off;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Referrer Policy
add_header Referrer-Policy "no-referrer" always;

# Content Security Policy (strict defaults)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

# Permissions Policy (restrict dangerous browser APIs)
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# Block hidden files and dotfiles (.git, .env, .svn, etc.) but allow Let's Encrypt challenge
location ~ /\.(?!well-known\/acme-challenge) {
    deny all;
    return 404;
}

# Block sensitive extensions, credentials, and source files - return 404 so existence is not leaked
location ~* \.(env|git|svn|htpasswd|pem|key|tfstate|sql|bak|old|swp|log|sqlite|sqlite3|db)$ {
    return 404;
}

# Block critical deployment manifests and source configs
location ~* ^/(composer\.json|package\.json|package-lock\.json|Dockerfile|docker-compose\.yml|\.dockerignore|\.gitignore)$ {
    return 404;
}

# Deny access to .well-known except acme-challenge
location ^~ /.well-known/ {
    allow all;
}
